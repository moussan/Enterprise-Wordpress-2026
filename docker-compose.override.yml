###############################################################################
# Enterprise WordPress 2026 — Local Development Override
# ============================================================================
# This file automatically applies when running `docker compose up` locally.
# It disables SSL, reduces resource limits, and enables debugging.
#
# For production: docker compose -f docker-compose.yml up -d
# (Explicitly excludes this override file)
###############################################################################

services:
  # ===========================================================================
  # NGINX — Development mode (HTTP only, no SSL)
  # ===========================================================================
  nginx:
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/wordpress-dev.conf:/etc/nginx/conf.d/default.conf:ro
      - wordpress_data:/var/www/html:ro
      - nginx_logs:/var/log/nginx
      - fastcgi_cache:/var/run/nginx-cache
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ===========================================================================
  # WORDPRESS — Development mode (debug enabled)
  # ===========================================================================
  wordpress:
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress_dev_password}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        /* === Redis Object Cache === */
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_DATABASE', 0);

        /* === Development Security (relaxed) === */
        define('DISALLOW_FILE_EDIT', false);
        define('FORCE_SSL_ADMIN', false);

        /* === Performance === */
        define('WP_MEMORY_LIMIT', '256M');
        define('WP_MAX_MEMORY_LIMIT', '256M');
        define('WP_POST_REVISIONS', 5);

        /* === Debug ON === */
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', true);
        define('SCRIPT_DEBUG', true);

        /* === Cron === */
        define('DISABLE_WP_CRON', false);

        /* === File Permissions === */
        define('FS_METHOD', 'direct');
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ===========================================================================
  # MARIADB — Development mode (reduced resources)
  # ===========================================================================
  mariadb:
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress_dev_password}
    ports:
      # Expose DB port for local tools (DBeaver, TablePlus, etc.)
      - "${MARIADB_PORT:-3306}:3306"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ===========================================================================
  # REDIS — Development mode (reduced memory)
  # ===========================================================================
  redis:
    ports:
      # Expose Redis port for local debugging
      - "${REDIS_PORT:-6379}:6379"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ===========================================================================
  # Disable SSL-related services in development
  # ===========================================================================
  certbot:
    profiles:
      - ssl

  fail2ban:
    profiles:
      - security
