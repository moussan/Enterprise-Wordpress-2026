name: Terraform Plan (Dev)

on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'modules/**'
      - 'environments/**'
      - '.github/workflows/terraform-*.yml'
    branches:
      - main
      - develop

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: "us-east-1"
  TF_CLOUD: false
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_ENVIRONMENT: dev
  TF_WORKING_DIR: terraform

jobs:
  terraform-plan:
    name: Terraform Fmt / Validate / Plan (Dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_BACKEND_DYNAMODB_TABLE }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform plan (Dev)
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var-file="../environments/${{ env.TF_ENVIRONMENT }}/terraform.tfvars" \
            -out=tfplan

      - name: Upload plan file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.TF_ENVIRONMENT }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan

      - name: Comment plan summary on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform-plan-${{ env.TF_ENVIRONMENT }}
          message: |
            ✅ **Terraform Plan (Env: `${{ env.TF_ENVIRONMENT }}`) succeeded**

            - Working dir: `${{ env.TF_WORKING_DIR }}`
            - Environment: `${{ env.TF_ENVIRONMENT }}`
            - AWS Region: `${{ env.AWS_REGION }}`

            Plan file: `tfplan` (uploaded as workflow artifact)
