###############################################################################
# Enterprise WordPress 2026 — CI Pipeline
# ============================================================================
# Runs on every push and pull request:
# - Lint Dockerfiles with Hadolint
# - Validate docker-compose syntax
# - Check .env.example for secrets
# - ShellCheck on all scripts
# - Validate Nginx configuration
# - Terraform checks (existing)
###############################################################################

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ===========================================================================
  # DOCKER — Validate compose files
  # ===========================================================================
  docker-validate:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate docker-compose.override.yml
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml config --quiet

  # ===========================================================================
  # SHELLCHECK — Lint all shell scripts
  # ===========================================================================
  shellcheck:
    name: ShellCheck Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
          severity: warning

  # ===========================================================================
  # SECRETS CHECK — Ensure no real secrets in tracked files
  # ===========================================================================
  secrets-check:
    name: Check for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check .env.example has no real secrets
        run: |
          echo "Checking .env.example for default/example values..."

          # Ensure .env.example exists
          if [ ! -f .env.example ]; then
            echo "ERROR: .env.example not found!"
            exit 1
          fi

          # Check that passwords are still placeholder values
          ISSUES=0

          # Check for common secret patterns (non-placeholder values)
          if grep -P 'PASSWORD=(?!.*CHANGE_THIS)(?!.*example)(?!.*changeme)(?!.*password)[A-Za-z0-9+/=]{16,}' .env.example; then
            echo "ERROR: .env.example may contain a real password!"
            ISSUES=$((ISSUES + 1))
          fi

          # Check for AWS keys
          if grep -P 'AKIA[0-9A-Z]{16}' .env.example; then
            echo "ERROR: .env.example may contain an AWS access key!"
            ISSUES=$((ISSUES + 1))
          fi

          # Check for private keys
          if grep -l 'BEGIN.*PRIVATE KEY' .env.example 2>/dev/null; then
            echo "ERROR: .env.example may contain a private key!"
            ISSUES=$((ISSUES + 1))
          fi

          # Ensure .env is not tracked
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "ERROR: .env is tracked in git! Remove it immediately."
            ISSUES=$((ISSUES + 1))
          fi

          if [ $ISSUES -gt 0 ]; then
            echo "Found $ISSUES potential secret(s) in tracked files!"
            exit 1
          fi

          echo "No secrets found in tracked files."

  # ===========================================================================
  # NGINX — Validate configuration syntax
  # ===========================================================================
  nginx-validate:
    name: Validate Nginx Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Nginx config syntax
        run: |
          # Use nginx Docker image to validate config
          docker run --rm \
            -v "${{ github.workspace }}/config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "${{ github.workspace }}/config/nginx/wordpress-dev.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine \
            nginx -t

  # ===========================================================================
  # TERRAFORM — Existing checks
  # ===========================================================================
  terraform-validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    if: hashFiles('terraform/**/*.tf') != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive
