###############################################################################
# Enterprise WordPress 2026 — Nginx Main Configuration
# ============================================================================
# Optimized for high-traffic WordPress with PHP-FPM backend.
# This file configures global Nginx settings. Server blocks are in
# /etc/nginx/conf.d/default.conf (mounted separately).
###############################################################################

# Run as non-root for security. The nginx Docker image handles user setup.
user nginx;

# Auto-detect CPU cores for optimal worker count.
# Each worker handles thousands of concurrent connections.
worker_processes auto;

# Increase file descriptor limit per worker to handle high concurrency.
worker_rlimit_nofile 65535;

# Log errors to stderr (Docker collects via logging driver).
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    # Max simultaneous connections per worker.
    # 4096 workers × auto cores = massive concurrency headroom.
    worker_connections 4096;

    # epoll is the most efficient connection processing method on Linux.
    use epoll;

    # Accept multiple connections at once (reduces latency under load).
    multi_accept on;
}

http {
    # =========================================================================
    # MIME Types & Basics
    # =========================================================================
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # =========================================================================
    # Logging — Structured format for log analysis tools
    # =========================================================================
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # =========================================================================
    # Performance — Kernel-level file serving & connection reuse
    # =========================================================================

    # sendfile: Serve files directly from kernel space (zero-copy).
    sendfile on;

    # tcp_nopush: Send HTTP headers and file data in one packet.
    # Only works with sendfile on. Reduces packet count.
    tcp_nopush on;

    # tcp_nodelay: Disable Nagle's algorithm for keepalive connections.
    # Reduces latency for small packets (API responses, AJAX).
    tcp_nodelay on;

    # Keep connections alive for 65 seconds (balances reuse vs memory).
    keepalive_timeout 65;

    # Max number of requests per keepalive connection before forcing reconnect.
    keepalive_requests 1000;

    # Hash table sizes for server names (increase for many vhosts).
    server_names_hash_bucket_size 128;
    types_hash_max_size 2048;

    # =========================================================================
    # Buffers — Prevent disk I/O for typical responses
    # =========================================================================

    # Client request body buffer (handles most POST requests in memory).
    client_body_buffer_size 16k;

    # Max request body size (matches PHP upload_max_filesize).
    client_max_body_size 128M;

    # Buffer for reading client request headers.
    client_header_buffer_size 1k;

    # Large client header buffers (handles big cookies/tokens).
    large_client_header_buffers 4 16k;

    # =========================================================================
    # Gzip Compression — Reduce bandwidth 60-80% for text content
    # =========================================================================
    gzip on;

    # Compress for all proxied requests (WordPress behind PHP-FPM).
    gzip_proxied any;

    # Minimum compression level (1=fastest, 9=smallest).
    # Level 6 is a good balance of CPU vs compression ratio.
    gzip_comp_level 6;

    # Minimum response size to compress (skip tiny responses).
    gzip_min_length 256;

    # Enable Vary header for caching proxies.
    gzip_vary on;

    # Compress these MIME types (text/html is always compressed).
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/opentype
        font/ttf
        font/woff
        font/woff2
        image/svg+xml
        image/x-icon;

    # =========================================================================
    # Security — Hide server version, limit request rates
    # =========================================================================

    # Don't reveal Nginx version in headers or error pages.
    server_tokens off;

    # =========================================================================
    # FastCGI Cache — Full-page cache for anonymous visitors
    # =========================================================================

    # Define cache zone: 256MB memory for keys, 1GB disk, inactive 60min.
    fastcgi_cache_path /var/run/nginx-cache
        levels=1:2
        keys_zone=WORDPRESS:256m
        max_size=1g
        inactive=60m
        use_temp_path=off;

    # Cache key: unique per URL, method, scheme.
    fastcgi_cache_key "$scheme$request_method$host$request_uri";

    # Serve stale cache while revalidating (instant response for users).
    fastcgi_cache_use_stale error timeout updating http_500 http_503;

    # Only one request updates the cache at a time (thundering herd protection).
    fastcgi_cache_lock on;
    fastcgi_cache_lock_timeout 5s;

    # Allow background updates of expiring cache entries.
    fastcgi_cache_background_update on;

    # =========================================================================
    # Upstream — PHP-FPM connection pool
    # =========================================================================
    upstream php-fpm {
        server wordpress:9000;

        # Keep persistent connections to PHP-FPM (reduces TCP handshakes).
        keepalive 32;
    }

    # =========================================================================
    # Rate Limiting — Protect against brute force and abuse
    # =========================================================================

    # Login rate limit: 5 requests per second per IP (burst 10).
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

    # Global rate limit: 30 requests per second per IP.
    limit_req_zone $binary_remote_addr zone=global:10m rate=30r/s;

    # XMLRPC rate limit: 1 request per second (heavily abused endpoint).
    limit_req_zone $binary_remote_addr zone=xmlrpc:10m rate=1r/s;

    # =========================================================================
    # Include server blocks
    # =========================================================================
    include /etc/nginx/conf.d/*.conf;
}
