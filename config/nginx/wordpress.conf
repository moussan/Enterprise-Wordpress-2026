###############################################################################
# Enterprise WordPress 2026 — Nginx Server Block (Production)
# ============================================================================
# WordPress-optimized server configuration with:
# - HTTPS (Let's Encrypt) with HTTP/2
# - FastCGI cache for anonymous visitors
# - Security headers (HSTS, CSP, XSS protection)
# - Static file caching with long expiry
# - Sensitive file access blocking
# - Rate limiting on login/xmlrpc endpoints
###############################################################################

# =========================================================================
# HTTP → HTTPS redirect (all traffic forced to SSL)
# =========================================================================
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN} www.${DOMAIN};

    # Let's Encrypt ACME challenge (must be accessible over HTTP).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect everything else to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# =========================================================================
# HTTPS Server — Main WordPress site
# =========================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name ${DOMAIN} www.${DOMAIN};
    root /var/www/html;
    index index.php index.html;

    # =====================================================================
    # SSL Configuration — TLS 1.2+ with modern ciphers
    # =====================================================================
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # Only allow TLS 1.2 and 1.3 (disable vulnerable older protocols).
    ssl_protocols TLSv1.2 TLSv1.3;

    # Server-preferred cipher order for best security/performance balance.
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # SSL session caching (reduces handshake overhead for returning visitors).
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling (faster certificate validation for clients).
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # =====================================================================
    # Security Headers — Defense in depth
    # =====================================================================

    # Prevent clickjacking: only allow framing from same origin.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Enable browser XSS filter (legacy but still useful).
    add_header X-XSS-Protection "1; mode=block" always;

    # Prevent MIME type sniffing (stops content-type confusion attacks).
    add_header X-Content-Type-Options "nosniff" always;

    # Control referrer information sent to external sites.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy — restrict resource loading sources.
    # Customize this based on your theme/plugins requirements.
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https: data:; frame-ancestors 'self';" always;

    # Permissions Policy — disable unnecessary browser features.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # HSTS: Force HTTPS for 1 year, include subdomains, allow preload list.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # =====================================================================
    # FastCGI Cache — Skip cache for logged-in users and POST requests
    # =====================================================================

    # Default: cache everything.
    set $skip_cache 0;

    # Don't cache POST requests (form submissions, AJAX writes).
    if ($request_method = POST) {
        set $skip_cache 1;
    }

    # Don't cache URLs with query strings (search results, filtered pages).
    if ($query_string != "") {
        set $skip_cache 1;
    }

    # Don't cache WordPress dynamic pages.
    if ($request_uri ~* "/wp-admin/|/wp-json/|/xmlrpc.php|wp-.*.php|/feed/|index.php|sitemap(_index)?.xml") {
        set $skip_cache 1;
    }

    # Don't cache logged-in users or recent commenters.
    if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wordpress_logged_in|wp-postpass") {
        set $skip_cache 1;
    }

    # Don't cache WooCommerce pages (if installed).
    if ($request_uri ~* "/cart/|/checkout/|/my-account/") {
        set $skip_cache 1;
    }

    # =====================================================================
    # Sensitive File Blocking — Deny access to critical files
    # =====================================================================

    # Block access to hidden files (.env, .git, .htaccess, etc.).
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block direct access to wp-config.php.
    location = /wp-config.php {
        deny all;
    }

    # Block xmlrpc.php (heavily abused for brute force and DDoS).
    location = /xmlrpc.php {
        limit_req zone=xmlrpc burst=2 nodelay;
        # Uncomment to fully block: deny all;
        include fastcgi_params;
        fastcgi_pass php-fpm;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Block access to readme.html and license.txt (info disclosure).
    location ~* ^/(readme\.html|license\.txt|wp-config-sample\.php)$ {
        deny all;
    }

    # Block PHP execution in uploads directory (prevents malicious uploads).
    location ~* /wp-content/uploads/.*\.php$ {
        deny all;
    }

    # Block access to WordPress include-only files.
    location ~* ^/wp-includes/.*\.php$ {
        # Allow wp-includes/ms-files.php for multisite.
        location ~ ^/wp-includes/ms-files\.php$ {
            include fastcgi_params;
            fastcgi_pass php-fpm;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
        deny all;
    }

    # =====================================================================
    # WordPress Login — Rate limited
    # =====================================================================
    location = /wp-login.php {
        limit_req zone=login burst=5 nodelay;

        include fastcgi_params;
        fastcgi_pass php-fpm;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Don't cache login pages.
        fastcgi_cache_bypass 1;
        fastcgi_no_cache 1;
    }

    # =====================================================================
    # Static Files — Long cache, served directly by Nginx
    # =====================================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|otf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;

        # Try file, then 404 (don't pass to PHP).
        try_files $uri =404;
    }

    # Serve robots.txt and humans.txt without logging.
    location ~* ^/(robots\.txt|humans\.txt|sitemap\.xml)$ {
        access_log off;
        log_not_found off;
        try_files $uri /index.php?$args;
    }

    # =====================================================================
    # PHP Processing — FastCGI pass to WordPress PHP-FPM
    # =====================================================================
    location ~ \.php$ {
        # Apply global rate limit.
        limit_req zone=global burst=20 nodelay;

        # Security: return 404 if PHP file doesn't exist (prevents path info attacks).
        try_files $uri =404;

        # Split path info for proper PHP processing.
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Pass to PHP-FPM upstream.
        fastcgi_pass php-fpm;
        fastcgi_index index.php;

        # FastCGI parameters.
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # FastCGI buffer settings (handle large WordPress responses).
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300s;

        # FastCGI cache settings.
        fastcgi_cache WORDPRESS;
        fastcgi_cache_valid 200 301 302 60m;
        fastcgi_cache_valid 404 1m;
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;

        # Add cache status header for debugging.
        add_header X-FastCGI-Cache $upstream_cache_status;

        # Keepalive connections to PHP-FPM.
        fastcgi_keep_conn on;
    }

    # =====================================================================
    # WordPress Permalinks — Pretty URL rewrite
    # =====================================================================
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # =====================================================================
    # WordPress REST API — Allow with rate limiting
    # =====================================================================
    location ~* ^/wp-json/ {
        limit_req zone=global burst=20 nodelay;
        try_files $uri $uri/ /index.php?$args;
    }

    # =====================================================================
    # Health Check Endpoint — For Docker/load balancer health checks
    # =====================================================================
    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
