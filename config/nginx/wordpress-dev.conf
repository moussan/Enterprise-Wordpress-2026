###############################################################################
# Enterprise WordPress 2026 — Nginx Server Block (Development)
# ============================================================================
# Simplified configuration for local development:
# - HTTP only (no SSL)
# - No HSTS or strict security headers
# - FastCGI cache disabled for live reloading
# - Debug-friendly settings
###############################################################################

server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    root /var/www/html;
    index index.php index.html;

    # =====================================================================
    # Security Headers — Relaxed for development
    # =====================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # =====================================================================
    # Sensitive File Blocking (same as production)
    # =====================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /wp-config.php {
        deny all;
    }

    # Block PHP execution in uploads directory.
    location ~* /wp-content/uploads/.*\.php$ {
        deny all;
    }

    # =====================================================================
    # Static Files — Short cache for development
    # =====================================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|otf|eot)$ {
        expires 1h;
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # =====================================================================
    # PHP Processing — FastCGI pass (no caching)
    # =====================================================================
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300s;
        fastcgi_keep_conn on;

        # NO caching in development.
    }

    # =====================================================================
    # WordPress Permalinks
    # =====================================================================
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # =====================================================================
    # Health Check Endpoint
    # =====================================================================
    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # =====================================================================
    # Exporter Endpoints — For Prometheus Monitoring
    # =====================================================================
    location = /nginx_status {
        stub_status;
        allow all;
        access_log off;
    }

    location = /fpm-status {
        include fastcgi_params;
        fastcgi_pass php-fpm;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        allow all;
        access_log off;
    }
}
