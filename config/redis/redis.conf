###############################################################################
# Enterprise WordPress 2026 — Redis Configuration
# ============================================================================
# Configured as a volatile cache (no persistence) for WordPress object caching.
# WordPress stores transients, query results, and session data here.
# Data loss on restart is acceptable — WordPress regenerates cache entries.
###############################################################################

# =============================================================================
# NETWORK — Accept connections from Docker network only
# =============================================================================

# Bind to all interfaces (Docker handles network isolation).
bind 0.0.0.0

# Default Redis port.
port 6379

# Disable protected mode (Docker network provides isolation).
# In non-Docker setups, enable this and set a password.
protected-mode no

# TCP backlog for connection queue.
tcp-backlog 511

# Close idle connections after 300 seconds (matches PHP timeout).
timeout 300

# Send TCP keepalive probes every 60 seconds (detect dead connections).
tcp-keepalive 60

# =============================================================================
# MEMORY — Size and eviction policy
# =============================================================================

# Maximum memory Redis will use.
# 256MB is generous for WordPress object cache (most sites use 50-100MB).
maxmemory 256mb

# Eviction policy: remove least recently used keys when memory is full.
# allkeys-lru is ideal for caching — evicts the coldest data first.
# Alternatives:
#   volatile-lru   — only evict keys with TTL set
#   allkeys-random — random eviction (simpler but less optimal)
#   noeviction     — return errors when full (NOT suitable for cache)
maxmemory-policy allkeys-lru

# Number of keys to sample when checking for eviction.
# Higher = more accurate LRU at slight CPU cost. 10 is a good balance.
maxmemory-samples 10

# =============================================================================
# PERSISTENCE — Disabled (cache-only mode)
# =============================================================================
# WordPress cache is regenerated on miss. Persistence adds unnecessary I/O
# and restart latency. If you need persistent Redis (sessions, queues),
# uncomment the RDB and/or AOF sections below.

# Disable RDB snapshots.
save ""

# Disable AOF (Append Only File).
appendonly no

# =============================================================================
# LOGGING — Minimal for production
# =============================================================================

# Log level: notice captures important events without noise.
# Options: debug, verbose, notice, warning
loglevel notice

# Log to stdout (Docker captures via logging driver).
logfile ""

# =============================================================================
# DATABASES
# =============================================================================

# Number of databases (0-15). WordPress uses database 0 by default.
# Keep 4 available for other uses (sessions in 1, page cache in 2, etc.).
databases 4

# =============================================================================
# CLIENT CONNECTIONS
# =============================================================================

# Maximum simultaneous client connections.
# Each PHP-FPM worker needs ~1 connection, plus WP-CLI, monitoring.
maxclients 256

# =============================================================================
# PERFORMANCE — Latency optimizations
# =============================================================================

# Lazy freeing: delete large keys in background thread (prevents blocking).
# Critical for WordPress — some cache keys can be very large (menus, widgets).
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

# Jemalloc memory allocator settings (if compiled with jemalloc).
# Reduces memory fragmentation over time.
# activedefrag yes
# active-defrag-enabled yes

# =============================================================================
# SECURITY
# =============================================================================

# Disable dangerous commands in production.
# FLUSHALL/FLUSHDB could wipe the cache; KEYS is O(N) and blocks Redis.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""

# Set a password if Redis is accessible outside Docker network.
# Uncomment and set a strong password:
# requirepass your-strong-redis-password

# =============================================================================
# SLOW LOG — Detect slow Redis operations
# =============================================================================

# Log operations slower than 10ms (10000 microseconds).
slowlog-log-slower-than 10000

# Keep last 128 slow log entries.
slowlog-max-len 128
