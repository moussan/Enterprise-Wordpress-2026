;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Enterprise WordPress 2026 — PHP-FPM Pool Configuration
; =============================================================================
; Tuned for production WordPress with dynamic process management.
; This file is mounted as /usr/local/etc/php-fpm.d/www.conf
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[www]

; =============================================================================
; PROCESS MANAGEMENT — Dynamic pool sizing
; =============================================================================

; Listen on TCP port 9000 (used by Nginx upstream).
listen = 9000

; Process owner (matches WordPress file permissions).
user = www-data
group = www-data

; Dynamic: spawns/kills workers based on demand.
; Alternatives: static (fixed workers), ondemand (spawn only when needed).
; Dynamic is best for production: handles spikes without wasting idle memory.
pm = dynamic

; Maximum number of child processes.
; Each process uses ~40-60MB for WordPress.
; Formula: Available_RAM / Average_Process_Size
; For 1GB container limit: ~16 workers.
pm.max_children = 16

; Number of workers created at startup.
; Start with enough to handle baseline traffic without cold starts.
pm.start_servers = 4

; Minimum idle workers (ready to handle sudden traffic spikes).
pm.min_spare_servers = 2

; Maximum idle workers (prevents wasting memory during low traffic).
pm.max_spare_servers = 8

; Maximum requests per worker before recycling (prevents memory leaks).
; WordPress plugins can leak memory; recycling workers keeps things stable.
pm.max_requests = 500

; =============================================================================
; SLOW LOG — Detect performance bottlenecks
; =============================================================================

; Log requests taking longer than this threshold.
; Helps identify slow plugins, queries, or API calls.
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

; Kill requests exceeding this time (prevents runaway processes).
request_terminate_timeout = 300s

; =============================================================================
; STATUS & HEALTH — Monitoring endpoints
; =============================================================================

; Enable FPM status page (useful for monitoring, accessed internally).
pm.status_path = /fpm-status

; Health check ping endpoint (used by Docker HEALTHCHECK).
ping.path = /fpm-ping
ping.response = pong

; =============================================================================
; LOGGING
; =============================================================================

; Send worker output to main error log.
catch_workers_output = yes

; Decorate worker output with metadata (pool name, PID).
decorate_workers_output = no

; Log level: notice captures important events without noise.
; Options: alert, error, warning, notice, debug.
; Use debug only temporarily — it's extremely verbose.
;log_level = notice

; =============================================================================
; RESOURCE LIMITS
; =============================================================================

; Open file descriptor limit per worker.
rlimit_files = 65535

; Core dump size limit (0 = disabled in production).
rlimit_core = 0

; =============================================================================
; ENVIRONMENT — Pass host environment to PHP workers
; =============================================================================

; Clear all environment variables and only pass specified ones.
; This prevents leaking host environment into PHP (security best practice).
clear_env = no

; Required environment variables (Docker passes these automatically).
; env[WORDPRESS_DB_HOST] = $WORDPRESS_DB_HOST
; env[WORDPRESS_DB_NAME] = $WORDPRESS_DB_NAME
; env[WORDPRESS_DB_USER] = $WORDPRESS_DB_USER
; env[WORDPRESS_DB_PASSWORD] = $WORDPRESS_DB_PASSWORD
