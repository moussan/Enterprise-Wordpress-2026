;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Enterprise WordPress 2026 — PHP Configuration
; =============================================================================
; Tuned for WordPress production performance with OPcache optimization.
; This file is mounted as /usr/local/etc/php/conf.d/custom.ini
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; =============================================================================
; MEMORY & EXECUTION — Handle complex WordPress operations
; =============================================================================

; Maximum memory per script (WordPress + plugins can be heavy).
; 512M covers WooCommerce, page builders, and bulk operations.
memory_limit = 512M

; Maximum execution time in seconds (covers slow API calls, imports).
max_execution_time = 300

; Maximum time parsing input data (large form submissions).
max_input_time = 300

; Maximum number of input variables (complex forms, bulk operations).
max_input_vars = 5000

; =============================================================================
; FILE UPLOADS — Support large media files
; =============================================================================

; Enable file uploads (required for WordPress media library).
file_uploads = On

; Maximum upload file size (matches Nginx client_max_body_size).
upload_max_filesize = 128M

; Maximum total POST body size (must be >= upload_max_filesize).
post_max_size = 128M

; Maximum number of files in a single upload request.
max_file_uploads = 20

; =============================================================================
; OPCACHE — Precompile and cache PHP bytecode (critical for performance)
; =============================================================================

; Enable OPcache (single biggest PHP performance optimization).
opcache.enable = 1

; Also enable for CLI scripts (WP-CLI benefits significantly).
opcache.enable_cli = 1

; Memory for cached bytecode (256MB handles large plugin ecosystems).
opcache.memory_consumption = 256

; Memory for interned strings (reduces duplicate string storage).
opcache.interned_strings_buffer = 32

; Maximum number of PHP files to cache (WordPress + plugins + themes).
opcache.max_accelerated_files = 20000

; How often to check for file changes (seconds).
; 0 = never check (best performance, requires restart after deploys).
; 60 = check every minute (good balance for production).
opcache.revalidate_freq = 60

; Validate timestamps (set to 0 in production if you restart PHP on deploy).
opcache.validate_timestamps = 1

; Save cache to disk for faster restarts.
opcache.file_cache = /tmp/opcache

; Enable huge pages for OPcache (if OS supports it).
; opcache.huge_code_pages = 1

; Preload script (uncomment and customize for maximum performance).
; opcache.preload = /var/www/html/wp-includes/preload.php
; opcache.preload_user = www-data

; =============================================================================
; SESSION — Secure session handling
; =============================================================================

; Store sessions in files (consider Redis for multi-server setups).
session.save_handler = files

; Strict mode prevents session fixation attacks.
session.use_strict_mode = 1

; Only send cookies over HTTPS.
session.cookie_secure = 1

; Prevent JavaScript access to session cookies (XSS protection).
session.cookie_httponly = 1

; SameSite cookie attribute (CSRF protection).
session.cookie_samesite = Lax

; Session garbage collection.
session.gc_maxlifetime = 1440
session.gc_probability = 1
session.gc_divisor = 1000

; =============================================================================
; ERROR HANDLING — Production-safe logging
; =============================================================================

; Display errors to browser: OFF in production (security risk).
display_errors = Off

; Display startup errors: OFF in production.
display_startup_errors = Off

; Log errors to file (monitored by log aggregation).
log_errors = On

; Maximum length of logged error strings.
log_errors_max_len = 4096

; Report all errors except deprecation notices.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; =============================================================================
; SECURITY — Harden PHP runtime
; =============================================================================

; Don't expose PHP version in headers.
expose_php = Off

; Disable dangerous functions (not needed by WordPress core).
; Note: Some plugins may need proc_open (Composer) — add exceptions as needed.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,parse_ini_file,show_source

; Limit file access to WordPress directory (open_basedir restriction).
; Uncomment and adjust if needed — can break some plugins.
; open_basedir = /var/www/html:/tmp

; Don't allow URL fopen (prevents SSRF via file functions).
; Note: Some WordPress features need this ON (set to On if required).
allow_url_fopen = On

; Never allow URL includes (prevents remote code execution).
allow_url_include = Off

; =============================================================================
; DATE & LOCALE
; =============================================================================

; Default timezone (WordPress handles its own timezone, this is for PHP).
date.timezone = UTC

; Default charset.
default_charset = "UTF-8"

; =============================================================================
; REALPATH CACHE — Speed up file path resolution
; =============================================================================

; Cache size for realpath lookups (WordPress has deep directory structures).
realpath_cache_size = 4096k

; Cache TTL in seconds.
realpath_cache_ttl = 600
